<!DOCTYPE html>
<html>
<head>

<title>Prediction Result | StayWise</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='assets/style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="navbar">

<div class="logo">StayWise</div>

<div class="nav-links">
<a href="/home">Home</a>
<a href="/about">About</a>
<a href="/predict-page">Predict</a>
<a href="/dashboard">Dashboard</a>
<a href="/support">Support</a>
<a href="/">Logout</a>
</div>

</div>

<div class="main-container">

<div class="glass-card result-card">

<h2 class="section-title">Prediction Result</h2>

<div class="gauge-box">
<canvas id="gaugeChart"></canvas>
</div>

<div id="resultText"></div>

<a href="/predict-page" class="btn-primary">Predict Again</a>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

const score = sessionStorage.getItem("predictionScore")

if(!score) return

const probability = parseFloat(score)*100
const remain = 100 - probability

const ctx = document.getElementById("gaugeChart")

new Chart(ctx,{

type:"doughnut",

data:{
labels:["Churn","Retention"],
datasets:[{
data:[probability,remain],
backgroundColor:["#ff4d4d","#00c897"]
}]
},

options:{

cutout:"70%",

animation:{
animateRotate:true,
duration:1800
},

plugins:{
legend:{display:false}
}

}

})

const result = probability >=50 ? "Customer Likely To Churn" : "Customer Stable"

document.getElementById("resultText").innerHTML = `
<h3 style="margin-top:20px">Churn Probability: ${probability.toFixed(1)}%</h3>
<p>${result}</p>
`

})

</script>

</body>
</html>
