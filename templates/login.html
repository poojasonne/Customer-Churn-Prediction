<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StayWise - Customer Retention AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/style.css') }}">
</head>
<body>

<div class="navbar">
    <a href="/" class="logo-container">
        <div class="logo-badge-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        </div>
        <span class="logo-text">StayWise</span>
        <span class="logo-tag">ML v2.0</span>
    </a>
</div>

<div class="main-container" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 160px);">

    <div class="glass-card" style="max-width:480px;width:100%;margin:auto;text-align:center;">
        
        <!-- Animated Security Shield Icon (Pure SVG - No external image) -->
        <div style="width:72px;height:72px;border-radius:20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.35);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 25px rgba(99,102,241,0.3);color:#38bdf8;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
        </div>

        <h2 class="section-title" style="font-size:26px;">Welcome to StayWise</h2>
        <p class="section-subtitle">Predict, analyze, and retain valuable customers with machine learning</p>

        <form onsubmit="return loginUser(event)" style="text-align:left;">

            <div class="form-group">
                <label>
                    <span>Email Address</span>
                    <span class="hint">Demo: admin@staywise.com</span>
                </label>
                <input type="email" id="loginEmail" placeholder="name@company.com" required value="admin@staywise.com">
            </div>

            <div class="form-group">
                <label>
                    <span>Password</span>
                    <span class="hint">Demo: 123456</span>
                </label>
                <div style="position:relative;">
                    <input type="password" id="loginPassword" placeholder="••••••••" required value="123456">
                    <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;" title="Toggle visibility">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width:100%;margin-top:10px;">
                <span>Sign In to Dashboard</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>

            <!-- 1-Click Fast Access Buttons -->
            <div style="display:flex;gap:10px;margin-top:14px;">
                <button type="button" class="btn-secondary btn-sm" onclick="quickFillDemo()" style="flex:1;">
                    Auto-Fill Demo
                </button>
                <button type="button" class="btn-secondary btn-sm" onclick="instantGuestLogin()" style="flex:1;">
                    Instant Guest Access
                </button>
            </div>

            <div id="loginFeedback"></div>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='assets/script.js') }}"></script>
</body>
</html>
