<!DOCTYPE html>
<html>
<head>

<title>Analytics Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='assets/style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="navbar">

<div class="logo">StayWise</div>

<div class="nav-links">
<a href="/home">Home</a>
<a href="/predict-page">Predict</a>
<a href="/dashboard">Dashboard</a>
<a href="/">Logout</a>
</div>

</div>

<div class="main-container">

<h2 class="section-title">Prediction Analytics</h2>

<div class="analytics-grid">

<div class="glass-card">

<h3>Total Predictions</h3>
<h1 id="totalPred"></h1>

</div>

<div class="glass-card">

<canvas id="riskChart"></canvas>

</div>

</div>

</div>

<script>

async function loadAnalytics(){

const res = await fetch("/history")

const data = await res.json()

document.getElementById("totalPred").innerText = data.length

let churn=0
let stay=0

data.forEach(r=>{
if(r.result==1) churn++
else stay++
})

const ctx=document.getElementById("riskChart")

new Chart(ctx,{
type:"bar",
data:{
labels:["Churn","Stay"],
datasets:[{
label:"Customers",
data:[churn,stay]
}]
}
})

}

loadAnalytics()

</script>

</body>
</html>
